name: Infinite Foundry CI

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Prepare headless Chrome wrapper
        run: |
          cat > /tmp/if-chrome <<'EOF'
          #!/usr/bin/env bash
          exec /usr/bin/google-chrome --headless=new "$@"
          EOF
          chmod +x /tmp/if-chrome
      - name: Browser render smoke
        env:
          CHROME_BIN: /tmp/if-chrome
        run: npm run qa:browser
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-render-evidence
          path: qa-browser/
          if-no-files-found: warn
          retention-days: 7
