<!doctype html><html><head><meta charset="utf-8"><title>Infinite Foundry UX QA</title><style>html,body{margin:0;background:#080c0f;color:#ddd;font:12px monospace}#game{width:100vw;height:100vh;border:0}#result{position:fixed;left:4px;top:4px;z-index:100;background:#000c;padding:4px}</style></head><body data-qa-ux="running"><div id="result">RUNNING</div><iframe id="game" title="Infinite Foundry QA"></iframe><script src="../../engine.js"></script><script>

const E=window.InfiniteFoundryEngine,KEY='infinite-foundry-save-v1',body=document.body,result=document.getElementById('result'),frame=document.getElementById('game');const wait=ms=>new Promise(r=>setTimeout(r,ms));function assert(v,m){if(!v)throw new Error(m)}function loadFrame(tag){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout '+tag)),9000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src='../../index.html?qaFlow='+tag+'&v='+Date.now()})}function blankFrame(){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe blank timeout')),4000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src='about:blank'})}async function seedFrame(s,tag){await blankFrame();localStorage.setItem(KEY,E.serialize(s));await loadFrame(tag)}

 d.querySelector('[data-speed="4"]').click();await wait(650);const runningClock=d.getElementById('clock').textContent;assert(runningClock!==clock0,'clock did not start after begin');d.getElementById('pauseBtn').click();await wait(80);const pauseClock=d.getElementById('clock').textContent;await wait(650);assert(d.getElementById('clock').textContent===pauseClock,'pause did not stop clock');assert(d.getElementById('pauseBtn').textContent==='RESUME','pause button state wrong');

 const meta=E.baseMeta(20260827);meta.introSeen=true;let mod=E.createState(meta);E.advance(mod,230);assert(mod.cycle.moduleInventory.length>=3,'module fixture insufficient');await seedFrame(mod,'module');await wait(260);d=frame.contentDocument;d.getElementById('statusBtn').click();await wait(80);const rows=[...d.querySelectorAll('.inventory-row')];assert(rows.length>=3,'module inventory not visible');const stored=rows.find(r=>[...r.querySelectorAll('button')].some(b=>!b.disabled));assert(stored,'no selectable module found');const choose=[...stored.querySelectorAll('button')].find(b=>!b.disabled);assert(choose.textContent.includes('/s')||choose.textContent.includes('line same'),'module throughput preview missing');choose.click();await wait(80);assert(d.getElementById('statusBays').textContent.includes('Refined Bearings')||d.getElementById('statusBays').textContent.includes('Thermal')||d.getElementById('statusBays').textContent.includes('Servo'),'module equip did not update bays');

 await loadFrame('era-brief-reload');await wait(320);d=frame.contentDocument;assert(!d.getElementById('eraBriefOverlay').hidden,'pending era briefing did not restore after reload');assert(d.getElementById('eraBriefEra').textContent.includes('ERA 2'),'restored era briefing wrong era');d.getElementById('manualSave').click();const preBeginReloadSave=JSON.parse(localStorage.getItem(KEY));assert(Math.abs(Number(preBeginReloadSave.state.cycle.time)-pendingGameTime)<.05,'pending briefing lost game time before UI restoration');const restoredBriefClock=d.getElementById('clock').textContent;await wait(650);assert(d.getElementById('clock').textContent===restoredBriefClock,'restored era briefing did not halt clock');d.getElementById('eraBriefBegin').click();await wait(160);assert(d.getElementById('eraBriefOverlay').hidden,'begin era did not close restored briefing');const pendingAfterBegin=JSON.parse(localStorage.getItem(KEY));assert(pendingAfterBegin?.state?.cycle?.playfeel?.eraBriefPending===false,'BEGIN ERA did not durably clear pending briefing');const begunGameTime=Number(pendingAfterBegin.state.cycle.time);await wait(420);d.getElementById('manualSave').click();const resumedAfterBegin=JSON.parse(localStorage.getItem(KEY));assert(Number(resumedAfterBegin.state.cycle.time)>begunGameTime+.2,'production clock did not resume after restored briefing');
 const saved=resumedAfterBegin;assert(saved.version===5,'save schema not v5');
 body.dataset.qaUx='pass';body.dataset.qaIntro='pass';body.dataset.qaPause='pass';body.dataset.qaPauseProvenance='pass';body.dataset.qaHelp='pass';body.dataset.qaStatus='pass';body.dataset.qaModule='pass';body.dataset.qaResult='pass';body.dataset.qaDirectUpgrade='pass';body.dataset.qaRetained='pass';body.dataset.qaEraBrief='pass';body.dataset.qaEraBriefReload='pass';body.dataset.qaOverclock='pass';result.textContent='PASS';
}
run().catch(e=>{body.dataset.qaUx='fail';body.dataset.qaError=e.message;result.textContent='FAIL '+e.message;console.error(e)});
</script></body></html>
