name: Infinite Foundry CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Browser render smoke
        run: node tools/qa/browser-smoke.js
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-render-evidence
          path: qa-browser/
          if-no-files-found: warn
          retention-days: 7
