name: M15 Release Candidate QA

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/m15-rc.yml'

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full M15 gate
        shell: bash
        run: |
          failed=0
          for test_file in tests/*.test.js; do
            echo "=== $test_file ==="
            node "$test_file" || failed=1
          done
          echo "=== browser release QA ==="
          npm run qa:release || failed=1
          exit "$failed"
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m15-browser-render-evidence
          path: qa-browser/
          if-no-files-found: warn
          retention-days: 7
      # One-shot M15 gate; final publication-acceptance rerun after all audit fixes.
