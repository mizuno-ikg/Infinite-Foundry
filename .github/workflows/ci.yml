name: Infinite Foundry CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Browser render smoke
        run: npm run qa:browser
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-render-evidence
          path: qa-browser/
          if-no-files-found: warn
          retention-days: 7
