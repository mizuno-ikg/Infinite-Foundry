<!doctype html><html><head><meta charset="utf-8"><title>Infinite Foundry Corrupt Save QA</title></head><body data-qa-corrupt="running"><iframe id="game" title="Infinite Foundry corrupt save QA"></iframe><script>
'use strict';
const KEY='infinite-foundry-save-v1',frame=document.getElementById('game'),wait=ms=>new Promise(r=>setTimeout(r,ms));
function assert(v,msg){if(!v)throw new Error(msg)}
function loadFrame(tag){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout '+tag)),7000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src='../../index.html?corruptQa='+tag+'&v='+Date.now()})}
async function run(){
  localStorage.setItem(KEY,'{ definitely not json');
  await loadFrame('json');await wait(250);
  let d=frame.contentDocument;assert(d&&d.body.dataset.era==='1','garbage JSON did not recover to fresh Era I');assert(d.getElementById('throughput').textContent,'game failed to render after garbage JSON');
  localStorage.setItem(KEY,JSON.stringify({version:4,state:{meta:{cycle:1,era:1,blueprints:0,patents:0,upgrades:{},patentUpgrades:{}},cycle:{time:10,credits:5,output:1}}}));
  await loadFrame('shape');await wait(250);d=frame.contentDocument;assert(d&&d.body.dataset.era==='1','malformed state shape did not recover to fresh Era I');assert(d.querySelectorAll('.machine').length===5,'factory controls missing after malformed save recovery');
  const recovered=JSON.parse(localStorage.getItem(KEY));assert(recovered&&recovered.state&&recovered.state.cycle&&recovered.state.cycle.levels,'fresh valid save was not written after recovery');
  document.body.dataset.qaCorrupt='pass';
}
run().catch(e=>{document.body.dataset.qaCorrupt='fail';document.body.dataset.qaError=e.message;console.error(e)});
</script></body></html>
