<!doctype html><html><head><meta charset="utf-8"><title>Infinite Foundry UX QA</title><style>html,body{margin:0;background:#080c0f;color:#ddd;font:12px monospace}#game{width:100vw;height:100vh;border:0}#result{position:fixed;left:4px;top:4px;z-index:100;background:#000c;padding:4px}</style></head><body data-qa-ux="running"><div id="result">RUNNING</div><iframe id="game" title="Infinite Foundry QA"></iframe><script src="../../engine.js"></script><script>
'use strict';
const E=window.InfiniteFoundryEngine,KEY='infinite-foundry-save-v1',body=document.body,result=document.getElementById('result'),frame=document.getElementById('game');const wait=ms=>new Promise(r=>setTimeout(r,ms));function assert(v,m){if(!v)throw new Error(m)}function loadFrame(tag){return new Promise((resolve,reject)=>{const t=setTimeout(()=>reject(new Error('iframe timeout '+tag)),9000);frame.onload=()=>{clearTimeout(t);resolve()};frame.src='../../index.html?qaFlow='+tag+'&v='+Date.now()})}
async function run(){
 localStorage.removeItem(KEY);await loadFrame('intro');await wait(350);let d=frame.contentDocument;
 assert(!d.getElementById('introOverlay').hidden,'new game intro missing');const clock0=d.getElementById('clock').textContent;await wait(500);assert(d.getElementById('clock').textContent===clock0,'intro did not stop clock');
 d.getElementById('introHelpBtn').click();await wait(50);assert(!d.getElementById('helpOverlay').hidden,'help did not open from intro');assert(d.querySelector('[data-playfeel-help="automation"]'),'automation help missing');d.getElementById('helpDone').click();d.getElementById('beginBtn').click();await wait(100);assert(d.getElementById('introOverlay').hidden,'begin did not close intro');
 assert(d.querySelectorAll('[data-upgrade-id]').length===5,'direct machine upgrade controls missing');assert(d.getElementById('automationStatus').textContent.includes('LOCKED'),'automation should default locked/off');const assembly=d.querySelector('[data-upgrade-id="assembly"]'),assemblyMachine=d.querySelector('.machine[data-id="assembly"]'),lv0=assemblyMachine.querySelector('em').textContent;assert(!assembly.disabled,'initial bottleneck direct upgrade should be enabled');assembly.click();await wait(90);assert(assemblyMachine.querySelector('em').textContent!==lv0,'direct upgrade did not change machine level');
 d.querySelector('[data-speed="4"]').click();await wait(650);const runningClock=d.getElementById('clock').textContent;assert(runningClock!==clock0,'clock did not start after begin');d.getElementById('pauseBtn').click();await wait(80);const pauseClock=d.getElementById('clock').textContent;await wait(650);assert(d.getElementById('clock').textContent===pauseClock,'pause did not stop clock');assert(d.getElementById('pauseBtn').textContent==='RESUME','pause button state wrong');d.getElementById('pauseBtn').click();
 d.getElementById('helpBtn').click();await wait(40);assert(!d.getElementById('helpOverlay').hidden,'help missing in game');d.getElementById('helpDone').click();d.getElementById('statusBtn').click();await wait(40);assert(!d.getElementById('statusOverlay').hidden,'status missing');assert(d.getElementById('permanentGrid').children.length===6,'permanent knowledge incomplete');assert(d.getElementById('statusLive'),'status live strip missing');assert(d.getElementById('statusLiveTime').textContent!=='--:--','status live time not populated');d.getElementById('statusClose').click();
 const meta=E.baseMeta(20260827);meta.introSeen=true;let mod=E.createState(meta);E.advance(mod,230);assert(mod.cycle.moduleInventory.length>=3,'module fixture insufficient');localStorage.setItem(KEY,E.serialize(mod));await loadFrame('module');await wait(260);d=frame.contentDocument;d.getElementById('statusBtn').click();await wait(50);const rows=[...d.querySelectorAll('.inventory-row')];assert(rows.length>=3,'module inventory not visible');const stored=rows.find(r=>[...r.querySelectorAll('button')].some(b=>!b.disabled));assert(stored,'no selectable module found');const choose=[...stored.querySelectorAll('button')].find(b=>!b.disabled);choose.click();await wait(80);assert(d.getElementById('statusBays').textContent.includes('Refined Bearings')||d.getElementById('statusBays').textContent.includes('Thermal')||d.getElementById('statusBays').textContent.includes('Servo'),'module equip did not update bays');
 let fail=E.createState(meta);E.advance(fail,300);assert(fail.cycle.ended&&!fail.cycle.result.win,'failure fixture wrong');fail.meta.blueprints=30;localStorage.setItem(KEY,E.serialize(fail));await loadFrame('result');await wait(260);d=frame.contentDocument;const resultPanel=d.getElementById('prestigePanel');assert(!resultPanel.hidden,'result panel missing');assert(resultPanel.compareDocumentPosition(d.getElementById('eraRail'))&Node.DOCUMENT_POSITION_FOLLOWING,'result panel not above game');assert(d.getElementById('resultReason').textContent.includes('bottleneck')||d.getElementById('resultReason').textContent.includes('bottleneck'.toUpperCase()),'failure explanation missing');d.getElementById('resultStatusBtn').click();await wait(50);assert(!d.getElementById('statusOverlay').hidden,'status not accessible from result');d.getElementById('statusClose').click();const eff=d.querySelector('[data-meta-upgrade="efficiency"]');assert(!eff.disabled,'blueprint fixture cannot upgrade');eff.click();await wait(60);assert(d.getElementById('retainedSummary').textContent.includes('1.08'),'retained strength not updated');d.getElementById('resultStatusBtn').click();await wait(50);
 d.getElementById('manualSave').click();const saved=JSON.parse(localStorage.getItem(KEY));assert(saved.version===5,'save schema not v5');
 body.dataset.qaUx='pass';body.dataset.qaIntro='pass';body.dataset.qaPause='pass';body.dataset.qaHelp='pass';body.dataset.qaStatus='pass';body.dataset.qaModule='pass';body.dataset.qaResult='pass';body.dataset.qaDirectUpgrade='pass';result.textContent='PASS';
}
run().catch(e=>{body.dataset.qaUx='fail';body.dataset.qaError=e.message;result.textContent='FAIL '+e.message;console.error(e)});
</script></body></html>
